name = "squiggle"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# The Worker serves the app itself, so the app and its relay share one origin
# (no CORS setup needed). Requests to /api/* always reach the Worker.
[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = ["/api/*"]
# Serve files exactly as named (no /page.html -> /page redirects).
html_handling = "none"

[vars]
# From your GitHub App's settings page (see README "Set up"):
GITHUB_CLIENT_ID = "Iv23liefG00Kw89snajP"
GITHUB_APP_SLUG = "squiggle-github"
# Lets the agent's fetch_url tool read pages that block browser requests.
ENABLE_FETCH = "true"
# Only needed if you also host the app somewhere else (comma-separated origins).
ALLOWED_ORIGINS = ""
# GitHub logins allowed to use the cloud model (comma-separated; empty = off).
AI_USERS = ""
AI_DAILY_NEURONS = "9000"

# Cloud model (optional): Gemma 4 26B on Workers AI for the GitHub logins in
# AI_USERS, with a hard daily cap (AI_DAILY_NEURONS, default 9000) kept under
# Cloudflare's free 10,000 neurons a day, so it never bills.
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "AI_BUDGET"
class_name = "AiBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiBudget"]
